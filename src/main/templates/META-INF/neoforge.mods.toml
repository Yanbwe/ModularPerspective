# Modular Perspective —— 模组元数据（占位符由 generateModMetadata 从 gradle.properties 展开）
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Yanbwe"
description='''
Modular Perspective（模块化俯视角）—— 面向 NeoForge 1.21.1 的双端俯视角/正交视角框架：
服务端以指令描述镜头，客户端做通道化仲裁与应用。设计文档见 docs/design.md（docs 不入 git）。
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
