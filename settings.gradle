pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// 本机网络无法访问 https://maven.neoforged.net（TLS 连接被重置），这里把社区 CDN 镜像
// 插到仓库列表最前面，仅承接 net.neoforged.* 组（NeoForge / NeoFormRuntime /
// AutoRenamingTool / mixinextras 等），其余依赖仍走 Maven Central 与插件自带的仓库。
// 若网络恢复可访问官方 maven，删除本段即可恢复默认行为。
gradle.beforeProject { project ->
    project.repositories.maven {
        name = 'NeoForgedCDN'
        url = 'https://neoforged.forgecdn.net/releases'
        content {
            includeGroupByRegex 'net\\.neoforged.*'
        }
    }
    project.repositories.mavenCentral()
}
